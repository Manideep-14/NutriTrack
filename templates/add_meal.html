<!DOCTYPE html>
<html>
<head>
    <title>Add Meal</title>

<!-- Link to external CSS file -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Page Header -->
<header>
    <h1>Add Meal</h1>
</header>

<!-- Navigation Menu -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/add-meal">Add Meal</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/summary">Summary</a>
</div>

<!-- Main Content Container -->
<div class="container">
    
    <!-- Add Meal Form Card -->
    <div class="card">

        <!-- Form to collect meal information -->
        <form method="POST">
            
            <!-- Food Name Input -->
            <label>Food Name</label>

            <input
                type="text"
                name="food"
                required>

            <!-- Protein Input -->   
            <label>Protein (g)</label>

            <input
                type="number"
                name="protein"
                required>

            <!-- Calories Input -->   
            <label>Calories</label>

            <input
                type="number"
                name="calories"
                required>

            <!-- Meal Type Dropdown -->
            <label>Meal Type</label>

            <select name="meal_type">

                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>

            </select>

             <!-- Submit Button -->
            <button type="submit">
                Add Meal
            </button>

        </form>

    </div>

</div>

</body>
</html>
