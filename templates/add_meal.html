<!DOCTYPE html>
<html>
<head>
    <title>Add Meal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Add Meal</h1>
</header>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/add-meal">Add Meal</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/summary">Summary</a>
</div>

<div class="container">

    <div class="card">

        <form method="POST">

            <label>Food Name</label>

            <input
                type="text"
                name="food"
                required>

            <label>Protein (g)</label>

            <input
                type="number"
                name="protein"
                required>

            <label>Calories</label>

            <input
                type="number"
                name="calories"
                required>

            <label>Meal Type</label>

            <select name="meal_type">

                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>

            </select>

            <button type="submit">
                Add Meal
            </button>

        </form>

    </div>

</div>

</body>
</html>
