<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>
    <h1>Meal Dashboard</h1>
</header>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/add-meal">Add Meal</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/summary">Summary</a>
</div>

<div class="container">

<div class="card">

<table>

<tr>
    <th>Food</th>
    <th>Protein</th>
    <th>Calories</th>
    <th>Meal Type</th>
</tr>

{% for meal in meals %}

<tr>

<td>{{ meal.food }}</td>

<td>{{ meal.protein }}</td>

<td>{{ meal.calories }}</td>

<td>{{ meal.meal_type }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</body>
</html>
